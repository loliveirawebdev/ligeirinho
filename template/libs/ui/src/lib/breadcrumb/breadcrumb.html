<nav [attr.aria-label]="label()">
  <ol class="text-body-medium flex flex-wrap items-center gap-x-1 gap-y-0.5 text-on-surface-variant">
    @for (item of items(); track $index; let last = $last) {
      <li class="flex min-w-0 items-center gap-1">
        @if (!last && item.link) {
          <!-- 40 px tall and at least as wide, the touch target (rules/responsive.md); the text keeps its line. -->
          <a
            class="block min-w-10 truncate rounded-sm py-2.5 text-center text-on-surface-variant underline-offset-4 hover:text-on-surface hover:underline focus-visible:outline-2 focus-visible:outline-primary"
            [routerLink]="item.link"
            >{{ item.label }}</a
          >
        } @else {
          <span class="truncate" [class.text-on-surface]="last" [attr.aria-current]="last ? 'page' : null">{{ item.label }}</span>
        }
        @if (!last) {
          <mat-icon class="!h-[18px] !w-[18px] shrink-0 !text-[18px]" aria-hidden="true">chevron_right</mat-icon>
        }
      </li>
    }
  </ol>
</nav>
