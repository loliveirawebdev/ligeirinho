<div class="flex items-center gap-3 border-b border-outline-variant px-4">
  <mat-icon class="shrink-0 text-on-surface-variant" aria-hidden="true">search</mat-icon>
  <input
    class="ui-command-palette-search text-body-large h-14 min-w-0 flex-1 border-0 bg-transparent p-0 text-on-surface outline-none"
    type="text"
    role="combobox"
    autocomplete="off"
    aria-autocomplete="list"
    aria-expanded="true"
    [attr.aria-controls]="listId"
    [attr.aria-activedescendant]="activeId()"
    [attr.aria-label]="text.searchLabel"
    [placeholder]="text.placeholder ?? ''"
    [value]="query()"
    (input)="type($event)"
    (keydown)="key($event)"
  />
</div>
<div class="ui-command-palette-list p-2" role="listbox" [id]="listId" [attr.aria-label]="text.searchLabel">
  @for (group of groups(); track group.name; let groupIndex = $index) {
    <div role="group" [attr.aria-labelledby]="listId + '-group-' + groupIndex">
      <div class="text-label-medium px-3 pb-1 pt-3 text-on-surface-variant" role="presentation" [id]="listId + '-group-' + groupIndex">
        {{ group.name }}
      </div>
      @for (command of group.commands; track command.id) {
        <div
          class="ui-command-palette-option"
          role="option"
          tabindex="-1"
          [id]="optionId(command)"
          [class.ui-command-palette-active]="command === active()"
          [attr.aria-selected]="command === active()"
          (click)="run(command)"
          (keydown.enter)="run(command)"
          (mousemove)="point(command)"
        >
          @if (command.icon) {
            <mat-icon class="shrink-0 text-on-surface-variant" aria-hidden="true">{{ command.icon }}</mat-icon>
          }
          <span class="ui-command-palette-label text-body-large min-w-0 flex-1 truncate">{{ command.label }}</span>
          @if (command.keys) {
            <ui-kbd class="shrink-0" [keys]="command.keys" />
          }
        </div>
      }
    </div>
  }
</div>
@if (groups().length === 0) {
  <p class="ui-command-palette-empty text-body-medium px-4 pb-6 pt-4 text-center text-on-surface-variant" role="status">{{ text.empty }}</p>
}
