<div class="mx-auto flex max-w-md flex-col items-center px-4 py-10 text-center">
  <mat-icon class="text-on-surface-variant" aria-hidden="true">{{ icon() }}</mat-icon>
  <p class="text-title-medium mt-2">{{ title() }}</p>
  @if (message()) {
    <p class="text-body-medium text-on-surface-variant mt-1">{{ message() }}</p>
  }
  <div class="mt-4 flex flex-wrap justify-center gap-2 empty:hidden"><ng-content select="[uiEmptyAction]" /></div>
</div>
