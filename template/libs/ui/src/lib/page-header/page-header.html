<header>
  @if (backLink(); as link) {
    <a matButton class="mb-2 -ml-3" [routerLink]="link.path">
      <mat-icon aria-hidden="true">arrow_back</mat-icon>
      <span data-label>{{ link.label }}</span>
    </a>
  }
  <div class="flex flex-col items-start gap-4">
    <div class="min-w-0">
      <h1 class="text-headline-medium break-words">{{ title() }}</h1>
      @if (supportingText()) {
        <p class="text-body-medium text-on-surface-variant mt-1 tabular-nums">{{ supportingText() }}</p>
      }
    </div>
    <div class="flex flex-wrap gap-2 empty:hidden"><ng-content select="[uiPageActions]" /></div>
  </div>
</header>
