<ng-template #panel let-list>
  <section class="ui-transfer-list" [class]="'ui-transfer-' + list.side" [attr.aria-label]="list.title">
    <header class="ui-transfer-header">
      <h3 class="text-title-small">{{ list.title }}</h3>
      <span class="ui-transfer-count text-label-medium text-on-surface-variant">{{ list.count }}</span>
    </header>
    <div class="flex flex-col gap-1 px-4 pt-3">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
        <mat-icon matPrefix aria-hidden="true">search</mat-icon>
        <input
          matInput
          type="search"
          autocomplete="off"
          [placeholder]="labels().search"
          [attr.aria-label]="labels().search"
          [disabled]="isDisabled()"
          (input)="search(list.side, $event)"
        />
      </mat-form-field>
      <mat-checkbox
        class="ui-transfer-all"
        [checked]="list.allChecked"
        [indeterminate]="list.someChecked"
        [disabled]="isDisabled() || list.items.length === 0"
        (change)="toggleAll(list)"
        >{{ labels().selectAll }}</mat-checkbox
      >
    </div>
    <mat-selection-list class="ui-transfer-options" [attr.aria-label]="list.title" [disabled]="isDisabled()" (selectionChange)="onSelection(list.side, $event)">
      @for (item of list.items; track item.value) {
        <mat-list-option togglePosition="before" [value]="item.value" [selected]="list.checked.has(item.value)" [disabled]="item.disabled ?? false">
          <span matListItemTitle>{{ item.label }}</span>
          @if (item.secondary) {
            <span matListItemLine>{{ item.secondary }}</span>
          }
        </mat-list-option>
      }
    </mat-selection-list>
    @if (list.items.length === 0) {
      <p class="text-body-medium px-4 pb-4 text-on-surface-variant">{{ labels().empty }}</p>
    }
  </section>
</ng-template>

<div class="ui-transfer">
  <ng-container *ngTemplateOutlet="panel; context: { $implicit: source() }" />
  <div class="ui-transfer-moves">
    <button
      matIconButton
      type="button"
      class="ui-transfer-move-right"
      [attr.aria-label]="labels().moveRight"
      [disabled]="isDisabled() || source().checked.size === 0"
      (click)="move('source')"
    >
      <mat-icon aria-hidden="true">chevron_right</mat-icon>
    </button>
    <button
      matIconButton
      type="button"
      class="ui-transfer-move-left"
      [attr.aria-label]="labels().moveLeft"
      [disabled]="isDisabled() || target().checked.size === 0"
      (click)="move('target')"
    >
      <mat-icon aria-hidden="true">chevron_left</mat-icon>
    </button>
  </div>
  <ng-container *ngTemplateOutlet="panel; context: { $implicit: target() }" />
</div>
