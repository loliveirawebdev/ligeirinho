<kbd class="inline-flex items-center gap-1 font-[inherit]">
  @for (key of keys(); track $index) {
    <kbd
      class="text-label-medium inline-flex h-5 min-w-5 items-center justify-center rounded-[6px] border border-b-2 border-outline-variant bg-surface-container-low px-1 font-[inherit] text-on-surface-variant"
      >{{ key }}</kbd
    >
  }
</kbd>
