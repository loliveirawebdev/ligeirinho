<div
  class="grid gap-3"
  [style.grid-template-columns]="'repeat(auto-fill, minmax(min(100%, ' + minWidth() + '), 1fr))'"
  [attr.role]="multiple() ? 'group' : 'radiogroup'"
  [attr.aria-label]="label()"
>
  @for (option of options(); track option.value) {
    @let isChosen = chosen().has(option.value);
    <label class="ui-check-card" [class.ui-check-card-chosen]="isChosen" [class.ui-check-card-disabled]="option.disabled">
      <input
        class="sr-only"
        [type]="multiple() ? 'checkbox' : 'radio'"
        [name]="name"
        [value]="option.value"
        [checked]="isChosen"
        [disabled]="option.disabled ?? false"
        (change)="choose(option)"
      />
      @if (option.icon) {
        <mat-icon class="ui-check-card-icon" aria-hidden="true">{{ option.icon }}</mat-icon>
      }
      <span class="min-w-0 flex-1">
        <span class="ui-check-card-title text-title-small block">{{ option.title }}</span>
        @if (option.description) {
          <span class="text-body-small mt-0.5 block text-on-surface-variant">{{ option.description }}</span>
        }
      </span>
      @if (option.note) {
        <span class="ui-check-card-note text-label-medium shrink-0 text-on-surface-variant">{{ option.note }}</span>
      }
      <mat-icon class="ui-check-card-mark" aria-hidden="true">{{
        multiple() ? (isChosen ? 'check_box' : 'check_box_outline_blank') : isChosen ? 'radio_button_checked' : 'radio_button_unchecked'
      }}</mat-icon>
    </label>
  }
</div>
